<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>SCTP Toluca - Red de Movilidad y Rutas</title>
    <!-- css local empaquetado de leaflet -->
    <link rel="stylesheet" href="file:///android_asset/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* estilo positron claro y limpio sobre mapa base para destacar rutas */
        .leaflet-tile-pane {
            filter: grayscale(90%) brightness(1.06) contrast(0.92);
        }
        .user-pulse-container {
            position: relative;
            width: 26px;
            height: 26px;
        }
        .user-pulse-ring {
            position: absolute;
            width: 38px;
            height: 38px;
            top: -6px;
            left: -6px;
            border-radius: 50%;
            background-color: rgba(29, 78, 216, 0.35);
            animation: pulse 2s infinite ease-out;
        }
        .user-pulse-dot {
            position: absolute;
            width: 20px;
            height: 20px;
            top: 3px;
            left: 3px;
            border-radius: 50%;
            background-color: #1d4ed8;
            border: 3.5px solid #ffffff;
            box-shadow: 0 3px 10px rgba(0,0,0,0.35);
        }
        @keyframes pulse {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(2.4); opacity: 0; }
        }

        /* insignia de autobus que avanza sobre la linea real de calles */
        .bus-badge {
            background: #0f172a;
            color: #ffffff;
            border: 2.5px solid #facc15;
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            animation: floatBus 1.8s infinite ease-in-out;
            cursor: pointer;
        }
        @keyframes floatBus {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* marcadores de paradas sctp estilo positron claro */
        .parada-marker {
            background-color: #ffffff;
            border: 2.5px solid #1d4ed8;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12.5px;
            font-weight: 800;
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(15,23,42,0.25);
        }
        .parada-marker.ruta-1 { border-color: #1d4ed8; color: #1d4ed8; }
        .parada-marker.ruta-2 { border-color: #059669; color: #047857; }

        /* popups estilizados y limpios */
        .leaflet-popup-content-wrapper {
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(15,23,42,0.18);
            padding: 6px 8px;
            font-size: 12.5px;
        }
        .popup-titulo {
            font-size: 14px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 2px;
        }
        .popup-badge {
            display: inline-block;
            font-size: 10.5px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 10px;
            margin-top: 5px;
        }
        .badge-azul { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .badge-verde { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .badge-ambar { background: #fefce8; color: #854d0e; border: 1px solid #fef08a; }
    </style>
</head>
<body>

<div id="map"></div>

<!-- js local empaquetado de leaflet -->
<script src="file:///android_asset/leaflet.js"></script>
<script>
    // limites de la zona de operacion toluca
    var boundsValle = L.latLngBounds(
        [19.0500, -99.8500],
        [19.4500, -99.3500]
    );

    // centro inicial en toluca con zoom contextual cercano
    var centro = [19.2840, -99.6420];

    var map = L.map('map', {
        center: centro,
        zoom: 15,
        minZoom: 11,
        maxZoom: 18,
        maxBounds: boundsValle,
        maxBoundsViscosity: 0.8,
        zoomControl: true,
        attributionControl: false
    });

    // mapa base claro estilo positron sin marcas de agua ni saturacion de color
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        subdomains: ['a', 'b', 'c']
    }).addTo(map);

    // marcador de ubicacion del usuario (gps en vivo)
    var coordsUsuario = [19.2840, -99.6420];
    var iconoUsuario = L.divIcon({
        className: 'user-pulse-container',
        html: '<div class="user-pulse-ring"></div><div class="user-pulse-dot"></div>',
        iconSize: [26, 26],
        iconAnchor: [13, 13]
    });

    var marcadorUsuario = L.marker(coordsUsuario, { icon: iconoUsuario, zIndexOffset: 3000 })
        .addTo(map)
        .bindPopup(
            '<div class="popup-titulo">📍 Tu ubicación real</div>' +
            '<div id="popupTxtUbicacion">Detectando posición GPS...</div>' +
            '<div class="popup-badge badge-azul">En tiempo real</div>'
        );

    var capaParadas = L.layerGroup().addTo(map);
    var capaRutas = L.layerGroup().addTo(map);

    // marcador del autobus simulado
    var marcadorAutobus = null;
    var timerSimulacion = null;
    var puntosRutaActual = [];
    var pasoActual = 0;
    var tieneRutaActiva = false;

    // actualizacion de coordenadas gps en vivo desde android
    window.actualizarUbicacionGps = function(lat, lng, descripcion, centrar) {
        coordsUsuario = [lat, lng];
        marcadorUsuario.setLatLng(coordsUsuario);
        marcadorUsuario.bindPopup(
            '<div class="popup-titulo">📍 Tu ubicación en tiempo real</div>' +
            '<div>' + (descripcion || 'GPS Activo') + '</div>' +
            '<div style="font-size: 11px; color: #64748b; margin-top: 2px;">' + lat.toFixed(5) + ', ' + lng.toFixed(5) + '</div>' +
            '<div class="popup-badge badge-azul">Sensor de dispositivo</div>'
        );

        // si el usuario pide centrar y no hay ruta fija, centrar con zoom de detalle
        if (centrar) {
            map.flyTo(coordsUsuario, 16, { duration: 0.8 });
            marcadorUsuario.openPopup();
        }
    };

    // funcion llamada desde android para renderizar paradas y trazar ruta real
    window.cargarParadasJson = function(paradasJson, idRutaFiltro) {
        try {
            var lista = typeof paradasJson === 'string' ? JSON.parse(paradasJson) : paradasJson;
            capaParadas.clearLayers();
            capaRutas.clearLayers();

            var paradasFiltradas = [];

            lista.forEach(function(p) {
                if (!p.latitud || !p.longitud) return;
                if (idRutaFiltro && idRutaFiltro > 0 && p.idRuta !== idRutaFiltro) return;

                var icono = L.divIcon({
                    className: 'parada-marker ruta-' + (p.idRuta || 1),
                    html: p.orden || '•',
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });

                var m = L.marker([p.latitud, p.longitud], { icon: icono });
                m.bindPopup(
                    '<div class="popup-titulo">🚏 ' + p.nombre + '</div>' +
                    '<div>Parada #' + p.orden + ' · +' + p.minutosDesdeOrigen + ' min</div>' +
                    '<div class="popup-badge badge-verde">Operando normalmente</div>'
                );
                m.addTo(capaParadas);
                paradasFiltradas.push(p);
            });

            if (paradasFiltradas.length >= 2) {
                tieneRutaActiva = true;
                // trazar ruta siguiendo las calles mediante servicio de ruteo osrm
                obtenerGeometriaCallesOSRM(paradasFiltradas, idRutaFiltro);
            } else if (paradasFiltradas.length === 1) {
                var pos = [paradasFiltradas[0].latitud, paradasFiltradas[0].longitud];
                map.setView(pos, 16);
            }
        } catch(e) {
            console.error('error al cargar paradas:', e);
        }
    };

    // consulta de ruta real siguiendo calles a traves de osrm
    function obtenerGeometriaCallesOSRM(paradas, idRutaFiltro) {
        // construir coordenadas formato lon,lat;lon,lat;...
        var waypoints = paradas.map(function(p) {
            return p.longitud.toFixed(6) + ',' + p.latitud.toFixed(6);
        }).join(';');

        var urlOsrm = 'https://router.project-osrm.org/route/v1/driving/' + waypoints + '?overview=full&geometries=geojson';

        var puntosDirectos = paradas.map(function(p) {
            return [p.latitud, p.longitud];
        });

        var colorRuta = (idRutaFiltro === 2) ? '#059669' : '#1d4ed8';

        var xhr = new XMLHttpRequest();
        xhr.open('GET', urlOsrm, true);
        xhr.timeout = 4000;

        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                        var coordsCalle = data.routes[0].geometry.coordinates.map(function(pt) {
                            return [pt[1], pt[0]]; // convertir lon,lat a lat,lon para leaflet
                        });

                        dibujarYAnimarRuta(coordsCalle, colorRuta, idRutaFiltro);
                        return;
                    }
                } catch(e) {
                    console.error('error procesando osrm:', e);
                }
            }
            // fallback en caso de error o sin conexion
            dibujarYAnimarRuta(puntosDirectos, colorRuta, idRutaFiltro);
        };

        xhr.onerror = function() {
            dibujarYAnimarRuta(puntosDirectos, colorRuta, idRutaFiltro);
        };

        xhr.ontimeout = function() {
            dibujarYAnimarRuta(puntosDirectos, colorRuta, idRutaFiltro);
        };

        xhr.send();
    }

    // dibuja el trazo curvo de calles y centra en tu ubicacion + ruta activa
    function dibujarYAnimarRuta(puntosCalle, colorRuta, idRutaFiltro) {
        capaRutas.clearLayers();

        // trazo de borde suave para resaltar sobre el fondo claro
        L.polyline(puntosCalle, {
            color: '#ffffff',
            weight: 9,
            opacity: 0.9,
            lineJoin: 'round'
        }).addTo(capaRutas);

        // linea principal de la ruta
        var lineaRuta = L.polyline(puntosCalle, {
            color: colorRuta,
            weight: 5.5,
            opacity: 0.95,
            lineJoin: 'round'
        }).addTo(capaRutas);

        // centrar el zoom en tu ubicacion y en la ruta activa sin alejarse al valle completo
        var bounds = L.latLngBounds(puntosCalle);
        if (coordsUsuario && coordsUsuario[0] && coordsUsuario[1]) {
            bounds.extend(coordsUsuario);
        }
        map.fitBounds(bounds, { padding: [35, 35], maxZoom: 15 });

        // iniciar la simulacion del autobus siguiendo las calles reales
        iniciarSimulacionAutobus(puntosCalle, idRutaFiltro);
    }

    // simulador de avance en tiempo real del autobus sobre las calles
    function iniciarSimulacionAutobus(puntos, idRuta) {
        if (timerSimulacion) {
            clearInterval(timerSimulacion);
        }

        // si los puntos ya provienen de osrm, tienen alta resolucion; si son directos interpolamos
        puntosRutaActual = puntos.length > 50 ? puntos : generarPuntosInterpolados(puntos, 25);
        pasoActual = 0;

        var iconoBus = L.divIcon({
            className: '',
            html: '<div class="bus-badge">🚍 Eco. 14</div>',
            iconSize: [110, 32],
            iconAnchor: [55, 16]
        });

        if (!marcadorAutobus) {
            marcadorAutobus = L.marker(puntosRutaActual[0], { icon: iconoBus, zIndexOffset: 5000 }).addTo(map);
        } else {
            marcadorAutobus.setLatLng(puntosRutaActual[0]);
            if (!map.hasLayer(marcadorAutobus)) marcadorAutobus.addTo(map);
        }

        marcadorAutobus.on('click', function() {
            mostrarDetalleAutobus(pasoActual);
        });

        // actualizar estimacion inicial
        actualizarEstimacion(0);

        // animar avance constante siguiendo la curva de las calles
        timerSimulacion = setInterval(function() {
            pasoActual = (pasoActual + 1) % puntosRutaActual.length;
            var pos = puntosRutaActual[pasoActual];
            marcadorAutobus.setLatLng(pos);
            actualizarEstimacion(pasoActual);
        }, 800);
    }

    function actualizarEstimacion(paso) {
        var total = puntosRutaActual.length;
        var porcentaje = Math.round((paso / total) * 100);
        var minutosRestantes = Math.max(1, Math.round(((total - paso) / total) * 35));

        var ahora = new Date();
        ahora.setMinutes(ahora.getMinutes() + minutosRestantes);
        var hh = ahora.getHours().toString().padStart(2, '0');
        var mm = ahora.getMinutes().toString().padStart(2, '0');
        var horaEstimada = hh + ':' + mm;

        if (marcadorAutobus && marcadorAutobus.getPopup() && marcadorAutobus.isPopupOpen()) {
            marcadorAutobus.setPopupContent(generarHtmlPopup(porcentaje, horaEstimada, minutosRestantes));
        }

        // notificar al panel nativo de android
        if (window.AndroidBridge && window.AndroidBridge.notificarEstimacion) {
            window.AndroidBridge.notificarEstimacion(horaEstimada, minutosRestantes);
        }
    }

    function mostrarDetalleAutobus(paso) {
        var total = puntosRutaActual.length;
        var porcentaje = Math.round((paso / total) * 100);
        var minutosRestantes = Math.max(1, Math.round(((total - paso) / total) * 35));

        var ahora = new Date();
        ahora.setMinutes(ahora.getMinutes() + minutosRestantes);
        var hh = ahora.getHours().toString().padStart(2, '0');
        var mm = ahora.getMinutes().toString().padStart(2, '0');
        var horaEstimada = hh + ':' + mm;

        marcadorAutobus.bindPopup(generarHtmlPopup(porcentaje, horaEstimada, minutosRestantes)).openPopup();
    }

    function generarHtmlPopup(porcentaje, hora, minutos) {
        return '<div class="popup-titulo">🚍 Autobús Eco. 14 en ruta</div>' +
               '<div>Trayecto recorrido: <b>' + porcentaje + '%</b></div>' +
               '<div style="margin-top: 4px;">⏱️ Llegada estimada: <b>' + hora + ' (' + minutos + ' min)</b></div>' +
               '<div class="popup-badge badge-ambar">Monitoreo GPS en tiempo real</div>';
    }

    function generarPuntosInterpolados(puntos, divisionesPorTramo) {
        var res = [];
        for (var i = 0; i < puntos.length - 1; i++) {
            var p1 = puntos[i];
            var p2 = puntos[i + 1];
            for (var d = 0; d < divisionesPorTramo; d++) {
                var frac = d / divisionesPorTramo;
                var lat = p1[0] + (p2[0] - p1[0]) * frac;
                var lng = p1[1] + (p2[1] - p1[1]) * frac;
                res.push([lat, lng]);
            }
        }
        res.push(puntos[puntos.length - 1]);
        return res;
    }

    function forzarRedimension() {
        if (typeof map !== 'undefined' && map) {
            map.invalidateSize(true);
        }
    }

    setTimeout(forzarRedimension, 250);
    setTimeout(forzarRedimension, 700);
    setTimeout(forzarRedimension, 1500);
</script>

</body>
</html>
