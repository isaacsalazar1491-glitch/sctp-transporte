<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>SCTP Toluca - Red de Movilidad y Rutas</title>
    <!-- css local empaquetado de leaflet -->
    <link rel="stylesheet" href="file:///android_asset/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #cbd5e1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* radar pulsante de ubicacion del usuario */
        .user-pulse-container {
            position: relative;
            width: 24px;
            height: 24px;
        }
        .user-pulse-ring {
            position: absolute;
            width: 34px;
            height: 34px;
            top: -5px;
            left: -5px;
            border-radius: 50%;
            background-color: rgba(37, 99, 235, 0.45);
            animation: pulse 1.8s infinite ease-out;
        }
        .user-pulse-dot {
            position: absolute;
            width: 18px;
            height: 18px;
            top: 3px;
            left: 3px;
            border-radius: 50%;
            background-color: #2563eb;
            border: 3.5px solid #ffffff;
            box-shadow: 0 2px 7px rgba(0,0,0,0.45);
        }
        @keyframes pulse {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(2.4); opacity: 0; }
        }

        /* marcadores de paradas sctp */
        .parada-marker {
            background-color: #ffffff;
            border: 2.5px solid #047857;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: #064e3b;
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
        }
        .parada-marker.ruta-1 { border-color: #2563eb; color: #1d4ed8; }
        .parada-marker.ruta-2 { border-color: #047857; color: #064e3b; }

        /* popups estilizados */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            padding: 4px 6px;
            font-size: 12px;
        }
        .popup-titulo {
            font-size: 13.5px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 2px;
        }
        .popup-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 4px;
        }
        .badge-azul { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .badge-verde { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    </style>
</head>
<body>

<div id="map"></div>

<!-- js local empaquetado de leaflet -->
<script src="file:///android_asset/leaflet.js"></script>
<script>
    // delimitacion para toluca, metepec, lerma y tianguistenco
    var boundsValle = L.latLngBounds(
        [19.0500, -99.8500],
        [19.4500, -99.3500]
    );

    // centro en toluca
    var centro = [19.2840, -99.6420];

    var map = L.map('map', {
        center: centro,
        zoom: 14,
        minZoom: 10,
        maxZoom: 18,
        maxBounds: boundsValle,
        maxBoundsViscosity: 0.8,
        zoomControl: true,
        attributionControl: false
    });

    // capa base osm
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        subdomains: ['a', 'b', 'c']
    }).addTo(map);

    // marcador de ubicacion del usuario (gps en vivo)
    var coordsUsuario = [19.2820, -99.6360];
    var iconoUsuario = L.divIcon({
        className: 'user-pulse-container',
        html: '<div class="user-pulse-ring"></div><div class="user-pulse-dot"></div>',
        iconSize: [24, 24],
        iconAnchor: [12, 12]
    });

    var marcadorUsuario = L.marker(coordsUsuario, { icon: iconoUsuario, zIndexOffset: 3000 })
        .addTo(map)
        .bindPopup(
            '<div class="popup-titulo">📍 Tu ubicacion real</div>' +
            '<div id="popupTxtUbicacion">Detectando posicion GPS...</div>' +
            '<div class="popup-badge badge-azul">En tiempo real</div>'
        );

    var capaParadas = L.layerGroup().addTo(map);

    // actualizacion de coordenadas gps en vivo desde android
    window.actualizarUbicacionGps = function(lat, lng, descripcion, centrar) {
        coordsUsuario = [lat, lng];
        marcadorUsuario.setLatLng(coordsUsuario);
        marcadorUsuario.bindPopup(
            '<div class="popup-titulo">📍 Tu ubicacion en tiempo real</div>' +
            '<div>' + (descripcion || 'GPS Activo') + '</div>' +
            '<div style="font-size: 11px; color: #64748b; margin-top: 2px;">' + lat.toFixed(5) + ', ' + lng.toFixed(5) + '</div>' +
            '<div class="popup-badge badge-azul">Sensor de dispositivo</div>'
        );
        if (centrar) {
            map.flyTo(coordsUsuario, 16, { duration: 1.0 });
            marcadorUsuario.openPopup();
        }
    };

    // funcion llamada desde android para renderizar paradas
    window.cargarParadasJson = function(paradasJson) {
        try {
            var lista = typeof paradasJson === 'string' ? JSON.parse(paradasJson) : paradasJson;
            capaParadas.clearLayers();
            var puntos = [coordsUsuario];

            lista.forEach(function(p) {
                if (!p.latitud || !p.longitud) return;

                var icono = L.divIcon({
                    className: 'parada-marker ruta-' + (p.idRuta || 1),
                    html: p.orden || '•',
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                var m = L.marker([p.latitud, p.longitud], { icon: icono });
                m.bindPopup(
                    '<div class="popup-titulo">🚏 ' + p.nombre + '</div>' +
                    '<div>Parada #' + p.orden + ' · +' + p.minutosDesdeOrigen + ' min</div>' +
                    '<div class="popup-badge badge-verde">Operando normalmente</div>'
                );
                m.addTo(capaParadas);
                puntos.push([p.latitud, p.longitud]);
            });

            if (puntos.length > 1) {
                map.fitBounds(puntos, { padding: [40, 40], maxZoom: 15 });
            }
        } catch(e) {
            console.error('error al parsear paradas:', e);
        }
    };

    function forzarRedimension() {
        if (typeof map !== 'undefined' && map) {
            map.invalidateSize(true);
        }
    }

    setTimeout(forzarRedimension, 250);
    setTimeout(forzarRedimension, 700);
    setTimeout(forzarRedimension, 1500);
</script>

</body>
</html>
